<!DOCTYPE html>
<html lang="en">
  <head>
    <title>OpenAPI Documentation - DAK API</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css"
          href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css">
    <style>
      body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
      /* Definition selector bar below the header */
      #definition-selector-bar {
        background-color: #0070a1;
        color: #ffffff;
        padding: 0.5rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.9rem;
        flex-wrap: wrap;
      }
      #definition-selector-bar label {
        font-weight: 600;
        white-space: nowrap;
      }
      #definition-select {
        font-size: 0.9rem;
        padding: 0.25rem 0.5rem;
        border-radius: 3px;
        border: 1px solid rgba(255,255,255,0.6);
        background-color: #ffffff;
        color: #00477d;
        min-width: 200px;
        max-width: 100%;
        flex: 1;
      }
      /* Hide Swagger UI topbar entirely */
      .swagger-ui .topbar {
        display: none;
      }
    </style>
  </head>
  <body>
  <!-- No header of its own: the site gives every page the IG's one bar. -->

  <div id="definition-selector-bar">
    <label for="definition-select">Select a definition:</label>
    <select id="definition-select" onchange="switchDefinition(this.value)">
    </select>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
  <script>
  var swaggerUrls = [
  {
    "url": "../ValueSet-TrustDemoCodeMappingBasisVS.openapi.json",
    "name": "How an imported dose got its national schedule code Schema"
  },
  {
    "url": "../ValueSet-TrustDemoDvcOutcomeVS.openapi.json",
    "name": "What a scanned DVC becomes in the record Schema"
  },
  {
    "url": "../ValueSet-TrustDemoOnesaEpiScheduleCodes.openapi.json",
    "name": "National schedule codes of the journeys Schema"
  },
  {
    "url": "../ValueSet-TrustDemoTrustDomains.openapi.json",
    "name": "Trust domains of the journeys Schema"
  },
  {
    "url": "../ValueSet-TrustDemoVaccineProducts.openapi.json",
    "name": "Vaccine products of the journeys Schema"
  },
  {
    "url": "../ValueSet-TrustDemoVerificationFailureReasonVS.openapi.json",
    "name": "Verification failure reasons Schema"
  },
  {
    "url": "../ValueSet-TrustDemoVerificationResultVS.openapi.json",
    "name": "Result of reading a DVC Schema"
  },
  {
    "url": "../ValueSet-TrustDemoVerificationStepVS.openapi.json",
    "name": "Verification steps Schema"
  },
  {
    "url": "../ValueSet-TrustDemoVhlRefusalReasonVS.openapi.json",
    "name": "Why a shared link released nothing Schema"
  },
  {
    "url": "../ValueSet-TrustDemoVhlTermsOfUse.openapi.json",
    "name": "Terms of use of the demo VHL trust domain Schema"
  },
  {
    "url": "../StructureDefinition-TrustDemoDdBirthDoseDvc.openapi.json",
    "name": "TD.J1 Birth-dose DVC"
  },
  {
    "url": "../StructureDefinition-TrustDemoDdChwReferral.openapi.json",
    "name": "TD.J2B Referral for verification"
  },
  {
    "url": "../StructureDefinition-TrustDemoDdChwRegistration.openapi.json",
    "name": "TD.J2A Newborn registration on a home visit"
  },
  {
    "url": "../StructureDefinition-TrustDemoDdDvcVerification.openapi.json",
    "name": "TD.J3A DVC verification and import"
  },
  {
    "url": "../StructureDefinition-TrustDemoDdImportedDose.openapi.json",
    "name": "TD.J3B Imported dose and schedule"
  },
  {
    "url": "../StructureDefinition-TrustDemoDdVhlAccess.openapi.json",
    "name": "TD.J41 Access to a shared link"
  },
  {
    "url": "../StructureDefinition-TrustDemoDdVhlShare.openapi.json",
    "name": "TD.J40 Shared link and consent"
  }
];
  var ui;
  window.onload = function() {
    var select = document.getElementById('definition-select');
    swaggerUrls.forEach(function(item, idx) {
      var opt = document.createElement('option');
      opt.value = item.url;
      opt.textContent = item.name;
      select.appendChild(opt);
    });
    ui = SwaggerUIBundle({
      url: "../ValueSet-TrustDemoCodeMappingBasisVS.openapi.json",
      dom_id: '#swagger-ui',
      presets: [SwaggerUIBundle.presets.apis],
      layout: "BaseLayout"
    });
  };
  function switchDefinition(url) {
    ui.specActions.updateUrl(url);
    ui.specActions.download(url);
  }
  </script>

  </body>
</html>
