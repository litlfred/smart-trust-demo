name: Repository checks

# Every action is pinned by commit SHA; the checks use the Python standard
# library only. [AGENTS.md]
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: smart-trust-tools' skills and requirements at the pinned commit (index.lock.json)
        run: |
          read -r repo ref < <(python3 -c "import json;m=next(m for m in json.load(open('index.lock.json'))['mounts'] if m['harness']=='smart-trust-tools');print(m['repository'],m['ref'])")
          git clone -q --filter=blob:none --no-checkout "https://github.com/$repo" smart-trust-tools
          git -C smart-trust-tools sparse-checkout set skills
          git -C smart-trust-tools checkout -q "$ref"
      - name: smart-base's skills at the pinned commit (index.lock.json)
        # The instance is the smart-base/ directory of that repository.
        run: |
          read -r repo ref < <(python3 -c "import json;m=next(m for m in json.load(open('index.lock.json'))['mounts'] if m['harness']=='smart-base');print(m['repository'],m['ref'])")
          git clone -q --filter=blob:none --no-checkout "https://github.com/$repo" smart-base-repo
          git -C smart-base-repo sparse-checkout set smart-base/skills
          git -C smart-base-repo checkout -q "$ref"
      - name: Actions pinned, JSON parses, memory front matter; the journeys, their skills and their requirements hang together
        run: python3 tools/repo-checks/repo_checks.py --smart-trust-tools smart-trust-tools --smart-base smart-base-repo/smart-base

  bpmn-generated:
    # The BPMN drawings and checklists are generated from processes/content/
    # by the harness's tools: rebuild them at the pinned layers and fail if a
    # committed one differs. The checklist generator writes every mounted
    # layer's checklists too; only this repository's are compared.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Lay down the pinned layers (index.lock.json)
        run: |
          python3 -c "import json;[print(m['harness'],m['repository'],m['ref']) for m in json.load(open('index.lock.json'))['mounts'] if m['harness'] not in ('smart-trust-tools','smart-base','who-iris')]" > "$RUNNER_TEMP/mounts.txt"
          while read -r h r ref; do git clone -q --filter=blob:none --no-checkout "https://github.com/$r" "$h" && git -C "$h" checkout -q "$ref" && rm -rf "$h/.git"; done < "$RUNNER_TEMP/mounts.txt"
          bun install --frozen-lockfile
          bun run cat mount:lock
      - name: The journeys and the workshop are well-formed and every reference they name resolves
        # The harness's gate over the user-scenario, workshop and
        # building-blocks kinds (it replaces tools/user-scenarios/check.py):
        # a file that does not parse as its kind is a finding too. An
        # example a step names is looked up in the artefact index the site's
        # publish builds (fhir-artifact-index/, gitignored), so here those
        # references can only be undetermined: every other reference must
        # resolve, and the examples are checked where the index exists.
        run: |
          bun run cat-harness-tools/scripts/check-journey-refs.ts --json > "$RUNNER_TEMP/journey-refs.json" || true
          python3 -c "import json,sys;r=json.load(open(sys.argv[1]));bad=r['findings']+[f for f in r['couldNotDetermine'] if 'built at publish' not in f['message']];[print('✗',f['file'],f['at'],f['message']) for f in bad];sys.exit(1 if bad or r.get('undetermined') else 0)" "$RUNNER_TEMP/journey-refs.json"
      - name: The translation templates are current (translations/)
        # One extraction for every translator: BPMN by the harness's
        # translate-bpmn, the pages by tools/translation/pages-pot.ts (the
        # harness's pot-extract over docs/ and input/pagecontent/).
        run: |
          bun run cat translate-bpmn:check -- --instance .
          bun tools/translation/pages-pot.ts --check
          bun run cat kg:locale:check -- --instance .
          bun run cat check:translation-officiality
      - name: How far each translation is behind its template (warns, never fails)
        # An English change leaves translations behind; that is reported here
        # as a warning per catalogue, not a failure. A stale template fails
        # above. Refresh: bun tools/translation/po-status.ts --merge.
        run: bun tools/translation/po-status.ts --github
      - name: Translation QA (fails only on a lost placeholder, tag or URL, or an official claim)
        run: python3 -I tools/translation/glossary_qa.py --check
      - name: Chromium, for the BPMN renderer
        # The renderer draws through bpmn-js in Chromium. The lockfile's own
        # Playwright installs the browser build it expects, as the harness
        # layers' CI does (a bare `npx playwright` may fetch another).
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: The BPMN drawings are current
        run: bun tools/render-bpmn/render_bpmn.ts --check
      - name: The BPMN checklists are current
        run: |
          bun run cat bpmn:checklist --out "$RUNNER_TEMP/checklists" > /dev/null
          stale=0
          for f in processes/content/*.checklist.md; do
            cmp -s "$f" "$RUNNER_TEMP/checklists/$(basename "$f")" || { echo "✗ $f is stale: run bun run cat bpmn:checklist"; stale=1; }
          done
          for b in processes/content/*.bpmn; do
            [ -f "${b%.bpmn}.checklist.md" ] || { echo "✗ ${b%.bpmn}.checklist.md is missing"; stale=1; }
          done
          exit $stale

  archimate:
    # The ArchiMate overlay on the DPI-H RA is generated: rebuild it from
    # tools/archimate/overlay.py and smart-ra at the commit (and sha256) in
    # tools/archimate/smart-ra.lock.json, and fail if the committed model differs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: The committed ArchiMate model is what the build makes
        run: python3 -I tools/archimate/build.py --check

  hcert-jars:
    # The Kotlin HCERT library at the commit lib/hcert/hcert.lock.json pins,
    # built by its own Gradle build and verification metadata; the jars must
    # match the recorded sha256. Same toolchain pins as smart-trust-tools.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "8.14.3"
      - name: Build the pinned HCERT jars and check their sha256
        run: python3 lib/hcert/build.py

  ig-sushi:
    # The L2 DAK and L3 IG: the generated L2 files match their harness
    # sources, and SUSHI builds the IG with no errors. SUSHI is pinned by
    # tools/ig-gen/package-lock.json and the FHIR packages by
    # tools/ig-gen/fhir-packages.lock.json, so nothing is resolved at run
    # time. Node is the runner's own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Generated L2 files are current
        run: python3 tools/ig-gen/ig_gen.py --check
      - name: Install SUSHI from the lockfile, install scripts off
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tools/ig-gen
      - name: Lay down the pinned FHIR packages
        run: python3 tools/ig-gen/fhir_cache.py
      - name: SUSHI, no errors
        run: tools/ig-gen/node_modules/.bin/sushi build .
      - name: The walkthrough's FHIR examples are SUSHI's (web/src/data/ig/)
        run: node web/scripts/ig-examples.mjs --check

  web:
    # The VaxLink walkthrough (web/) builds from this commit: its BPMN
    # drawings, actors and moment pictures are read from processes/content/,
    # scenarios/actors/ and docs/images/ at build time, so a build here is the
    # check that they still resolve. npm installs from web/package-lock.json
    # (integrity), install scripts off. Node is the runner's own, as in ig-sushi.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install from the lockfile, install scripts off
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix web
      - name: Type-check and build
        run: npm run build --prefix web
