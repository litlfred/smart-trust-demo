name: Android test of the HCERT library

# Plan step 4 (STT-GEN-004): the Kotlin HCERT library's JVM jars, built from
# the pinned smart-trust-tools commit, run in instrumented tests on Android
# emulators, on the platform's own crypto providers.
#
# Every Gradle artifact is pinned by sha256 in
# android-test/gradle/verification-metadata.xml. This sandbox cannot reach
# Google Maven, so the first run on a branch without that file writes it
# here, on GitHub's runner (trust on first use, over TLS from
# dl.google.com and Maven Central), and commits it to the branch for review.
# From then on a different byte fails the build. Actions are pinned by SHA.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: ["android-test/**", "lib/hcert/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android-test/**", "lib/hcert/**", ".github/workflows/android.yml"]

jobs:
  verification-metadata:
    # Only on a push to a branch of this repository that has no metadata yet.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      written: ${{ steps.write.outputs.written }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - id: need
        run: |
          if [ -f android-test/gradle/verification-metadata.xml ]; then echo "need=false" >> "$GITHUB_OUTPUT"; else echo "need=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.need.outputs.need == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - if: steps.need.outputs.need == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - if: steps.need.outputs.need == 'true'
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "8.14.3"
      - id: write
        if: steps.need.outputs.need == 'true'
        run: |
          python3 lib/hcert/build.py
          gradle -p android-test --no-daemon --write-verification-metadata sha256 assembleDebugAndroidTest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-test/gradle/verification-metadata.xml
          git commit -m "android-test: Gradle verification metadata, written on the runner (trust on first use)"
          git push
          echo "written=true" >> "$GITHUB_OUTPUT"

  emulator:
    needs: [verification-metadata]
    # Skipped when the metadata was only just written: that push needs a review
    # and a new commit to run the tests against it.
    if: always() && needs.verification-metadata.outputs.written != 'true' && needs.verification-metadata.result != 'failure'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The metadata exists
        run: test -f android-test/gradle/verification-metadata.xml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "8.14.3"
      - name: Build the pinned HCERT jars and check their sha256
        run: python3 lib/hcert/build.py
      - name: Build the test APK against the verification metadata
        run: gradle -p android-test --no-daemon assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle -p android-test --no-daemon connectedDebugAndroidTest
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-test-results-api${{ matrix.api-level }}
          path: android-test/build/reports/androidTests/
