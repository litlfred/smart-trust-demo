# Compile this IG's translation CodeSystem supplements
# (input/fsh/translations/<locale>.fsh) and check them on every pull request
# that touches them: SUSHI with 0 errors, every designated code a code of the
# supplemented CodeSystem, and each file's language its locale. The ig-sushi
# job in checks.yml compiles them too, but does not check codes or languages.
# The steps are fhir-harness's, at the commit index.lock.json pins.
name: Translation supplements

on:
  pull_request:
    paths:
      - "input/fsh/**"
      - "sushi-config.yaml"
      - "index.config.json"
      - "index.lock.json"
      - ".github/workflows/translation-supplements.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supplements:
    uses: litlfred/fhir-harness/.github/workflows/translation-supplements.yml@3ef4b4fe35953bbca3777f1dd19243cfa7b8748a # index.lock.json
